name: Test

on:
  push:
  pull_request:
    branches:
      - next
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.label == '' && 'PHPUnit Tests' || format('PHPUnit Tests ({0})', matrix.label) }}

    # Every PHP version from 8.3 up (Dixlase/dixlase-core#977) on SQLite and
    # the newest MySQL and MariaDB LTS, plus PHP 8.3 on the supported floor
    # (MySQL 8.4, MariaDB 10.11) and, warn-only, on versions still widely
    # run outside the supported range (MySQL 8.0, MariaDB 11.8)
    # (Dixlase/dixlase-core#981). `experimental` legs (PHP 8.6 while it is a
    # development build, and the warn-only ones) report but do not fail the
    # workflow. SQLite accepts values MySQL and MariaDB refuse (an empty
    # string in an integer or datetime column, for one), which is why both
    # kinds run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            db: sqlite
            image: ''
            health: ''
            experimental: false
            label: ''
          - php: '8.3'
            db: mysql
            image: 'mysql:9.7'
            health: 'mysqladmin ping'
            experimental: false
            label: 'MySQL 9.7, PHP 8.3'
          - php: '8.3'
            db: mariadb
            image: 'mariadb:12.3'
            health: 'healthcheck.sh --connect --innodb_initialized'
            experimental: false
            label: 'MariaDB 12.3, PHP 8.3'
          - php: '8.4'
            db: sqlite
            image: ''
            health: ''
            experimental: false
            label: 'SQLite, PHP 8.4'
          - php: '8.4'
            db: mysql
            image: 'mysql:9.7'
            health: 'mysqladmin ping'
            experimental: false
            label: 'MySQL 9.7, PHP 8.4'
          - php: '8.4'
            db: mariadb
            image: 'mariadb:12.3'
            health: 'healthcheck.sh --connect --innodb_initialized'
            experimental: false
            label: 'MariaDB 12.3, PHP 8.4'
          - php: '8.5'
            db: sqlite
            image: ''
            health: ''
            experimental: false
            label: 'SQLite, PHP 8.5'
          - php: '8.5'
            db: mysql
            image: 'mysql:9.7'
            health: 'mysqladmin ping'
            experimental: false
            label: 'MySQL 9.7, PHP 8.5'
          - php: '8.5'
            db: mariadb
            image: 'mariadb:12.3'
            health: 'healthcheck.sh --connect --innodb_initialized'
            experimental: false
            label: 'MariaDB 12.3, PHP 8.5'
          - php: '8.6'
            db: sqlite
            image: ''
            health: ''
            experimental: true
            label: 'SQLite, PHP 8.6'
          - php: '8.6'
            db: mysql
            image: 'mysql:9.7'
            health: 'mysqladmin ping'
            experimental: true
            label: 'MySQL 9.7, PHP 8.6'
          - php: '8.6'
            db: mariadb
            image: 'mariadb:12.3'
            health: 'healthcheck.sh --connect --innodb_initialized'
            experimental: true
            label: 'MariaDB 12.3, PHP 8.6'
          - php: '8.3'
            db: mysql
            image: 'mysql:8.4'
            health: 'mysqladmin ping'
            experimental: false
            label: 'MySQL 8.4, PHP 8.3'
          - php: '8.3'
            db: mariadb
            image: 'mariadb:10.11'
            health: 'healthcheck.sh --connect --innodb_initialized'
            experimental: false
            label: 'MariaDB 10.11, PHP 8.3'
          - php: '8.3'
            db: mysql
            image: 'mysql:8.0'
            health: 'mysqladmin ping'
            experimental: true
            label: 'MySQL 8.0, PHP 8.3'
          - php: '8.3'
            db: mariadb
            image: 'mariadb:11.8'
            health: 'healthcheck.sh --connect --innodb_initialized'
            experimental: true
            label: 'MariaDB 11.8, PHP 8.3'

    services:
      db:
        # An empty image (the SQLite legs) starts no service container.
        image: ${{ matrix.image }}
        env:
          # The MariaDB image reads the MYSQL_* names as aliases.
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dixlase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Checkout core
        uses: actions/checkout@v5
        with:
          repository: Dixlase/dixlase-core
          ref: main
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, json, sqlite3, pdo_sqlite, pdo_mysql, gd
          coverage: none

      - name: Place plugin into core directory
        run: |
          # Core no longer tracks `plugins/` as a populated tree (plugins
          # are installed via composer in production), so `core/plugins/`
          # does not exist after `actions/checkout` of core. Create the
          # parent dir explicitly, then remove any stale path before
          # moving the freshly-checked-out plugin into place.
          mkdir -p core/plugins
          rm -rf core/plugins/DixlaseCookie
          mv plugin core/plugins/DixlaseCookie

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: core/vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install core composer dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Sync plugin autoload mappings
        working-directory: core
        run: |
          # composer.local.json を生成（プラグインの psr-4 マッピングを集約）
          # 通常は pre-autoload-dump フックで実行されるが --no-scripts のため明示実行
          php scripts/sync-local-autoload.php
          composer dump-autoload --no-scripts --optimize

      - name: Setup test environment
        working-directory: core
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "APP_KEY=${APP_KEY}" >> .env

      - name: Run PHPUnit tests (SQLite)
        if: matrix.db == 'sqlite'
        working-directory: core/plugins/DixlaseCookie
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: ../../vendor/bin/phpunit

      - name: Run PHPUnit tests (MySQL / MariaDB)
        if: matrix.db != 'sqlite'
        working-directory: core/plugins/DixlaseCookie
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
          # phpunit.xml's <env> entries are not forced, so these win. Core's
          # TestCase refuses MySQL drivers unless told the database is a
          # disposable one -- which the service container above is.
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dixlase_test
          DB_USERNAME: root
          DB_PASSWORD: password
          DLS_TESTS_ALLOW_NON_SQLITE: '1'
        run: ../../vendor/bin/phpunit
